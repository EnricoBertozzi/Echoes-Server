# Configuração do Mosquitto para o ambiente local (docker-compose).
# A porta 1883 é exposta no host via docker-compose.yml (variável MQTT_PORT).

# Escuta em todas as interfaces — sem isso a porta exposta não fica acessível
# fora do container (a configuração padrão da imagem escuta apenas em 127.0.0.1).
listener 1883 0.0.0.0

# Autenticação obrigatória (S5): sem ela qualquer um da rede publica em "register".
# Crie o arquivo de senhas com:
#   mosquitto_passwd -c mosquitto/config/passwd <usuario>
# e use as mesmas credenciais em MQTT_USERNAME / MQTT_PASSWORD do .env.
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
