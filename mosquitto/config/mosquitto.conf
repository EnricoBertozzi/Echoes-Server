# Configuração do Mosquitto para o ambiente local (docker-compose).
# A porta 1883 é exposta no host via docker-compose.yml (variável MQTT_PORT).

# Escuta em todas as interfaces — sem isso a porta exposta não fica acessível
# fora do container (a configuração padrão da imagem escuta apenas em 127.0.0.1).
listener 1883 0.0.0.0

# Sem autenticação para simplificar o ambiente local.
# Para exigir usuário/senha, gere um arquivo com `mosquitto_passwd`
# e troque para false.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
