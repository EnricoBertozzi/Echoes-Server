services:
  spring:
    build: .
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
    env_file:
      - ./.env

    volumes:
      - ./certs:/app/certs
      - ./keystore.p12:/app/keystore.p12

  mysql:
    image: mysql:8.0
    ports:
      - "${DATABASE_PORT}:3306"
    volumes:
      - mysql-volume:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_USER_PASSWORD}

  redis:
    image: redis:7.2
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-volume:/data/redis

volumes:
  mysql-volume:
  redis-volume:
