services:
  spring:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      DATABASE_HOST: mysql
      DATABASE_URL: jdbc:mysql://mysql:3306/${DATABASE_NAME}?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
      REDIS_HOST: redis
      # dentro do stack o app fala com o broker pelo nome do serviço
      MQTT_BROKER_URL: tcp://mosquitto:1883
    volumes:
      # keystore TLS fica em ./certs/keystore.p12 (S3)
      - ./certs:/app/certs

  mysql:
    image: mysql:8.0
    command: --log-bin-trust-function-creators=1
    ports:
      # somente loopback do host: o banco não fica exposto nas demais interfaces (S7)
      - "127.0.0.1:${DATABASE_PORT}:3306"
    volumes:
      - mysql-volume:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_USER_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.2
    restart: always
    ports:
      # somente loopback do host (S7)
      - "127.0.0.1:${REDIS_PORT}:6379"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-volume:/data/redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      # somente loopback do host (S7); dispositivos externos devem passar por proxy TLS
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    volumes:
      # mosquitto.conf + passwd (gerado por mosquitto/create-passwd.sh)
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h 127.0.0.1 -p 1883 -u \"$${MQTT_USERNAME}\" -P \"$${MQTT_PASSWORD}\" -t '$$SYS/broker/uptime' -C 1 -W 3",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  mysql-volume:
  redis-volume:
  mosquitto-data:
