env:
  contexts:
    - name: Echoes Server
      urls:
        - http://127.0.0.1:8080
  parameters:
    failOnError: true
    failOnWarning: true

jobs:
  # Respostas públicas e verificação de acesso anônimo a uma rota protegida
  - type: passiveScan-config
    parameters:
      scanOnlyInScope: true

  - type: requestor
    requests:
      - url: http://127.0.0.1:8080/terms/TERMS_OF_USE
        method: GET
        responseCode: 200
      - url: http://127.0.0.1:8080/terms/PRIVACY_POLICY
        method: GET
        responseCode: 200
      - url: http://127.0.0.1:8080/terms/PRIVACY_POLICY/json
        method: GET
        responseCode: 200
      - url: http://127.0.0.1:8080/terms
        method: GET
        responseCode: 401
      - url: http://127.0.0.1:8080/swagger-ui/index.html
        method: GET
        responseCode: 200

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  # Gera o relatório antes de avaliar a severidade dos alertas
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/reports
      reportFile: zap-passivo.json

  - type: exitStatus
    parameters:
      errorLevel: High
      errorExitValue: 1
