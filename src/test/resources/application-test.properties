file.upload-dir=target/test-uploads
api.security.files-extensions-allowed=mp3,wav,ogg,m4a
# Bloqueia a importação do .env
spring.config.import=
spring.application.name=echoes-server-test

# Sobrescreve as chaves exatas do datasource
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Sobrescreve a chave EXATA que estava a forçar o MySQL no teu application.properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false



# Segurança e Redis
api.security.token.secret=uma_chave_secreta_e_longa_com_mais_de_32_caracteres_para_os_testes_dummy
server.ssl.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Redis local com senha: export REDIS_PASSWORD=<senha>; vazio = conecta sem auth (CI)
spring.data.redis.password=${REDIS_PASSWORD:}

# MQTT desligado nos testes (nenhum broker é necessário)
mqtt.enabled=false

# Outros Mocks
twofactor.provider=logger
api.smtp.token=dummy

# E-mail dummy
spring.mail.host=localhost
spring.mail.port=465
spring.mail.username=dummy
spring.mail.password=dummy

# Módulo CNPJ — nenhum teste bate na rede real; URL só existe para o bean subir
cnpj.brasil-api.url=https://brasilapi.com.br
cnpj.timeout-seconds=2
cnpj.cache-ttl-hours=1
cnpj.cache-max-size=10

# Notificação de instituições — logger evita envio real de e-mail nos testes
institution.notifier=logger
institution.alert-email=

# Scheduler desabilitado em testes (delay praticamente infinito)
institution.verification.retry-interval-ms=999999999
institution.verification.initial-delay-ms=999999999

api.security.admin.email=admin@test.local
api.security.admin.username=santana
api.security.admin.password=12345678

spring.thymeleaf.check-template-location=false

# Limitação de taxa desligada nos testes (evita baldes compartilhados entre casos)
api.rate-limit.enabled=false

# Chave da assinatura dos registros de auditoria, 32+ bytes aleatórios
api.audit.hmac-key=test-audit-hmac-key-for-tests-only-0123456789

# Actuator como em produção (o application.properties de teste substitui o principal)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
management.health.redis.enabled=false

# Chave AES-256 da criptografia em repouso, somente para testes
api.crypto.data-key=dGVzdC1kYXRhLWVuY3J5cHRpb24ta2V5LTMyLWJ5dGU=
api.crypto.key-id=v1
