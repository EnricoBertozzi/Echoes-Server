# Bloqueia a importação do .env
spring.config.import=
spring.application.name=echoes-server-test

# Sobrescreve as chaves exatas do datasource
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Sobrescreve a chave EXATA que estava a forçar o MySQL no teu application.properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Segurança e Redis
api.security.token.secret=uma_chave_secreta_e_longa_com_mais_de_32_caracteres_para_os_testes_dummy
server.ssl.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Redis local com senha: export REDIS_PASSWORD=<senha>; vazio = conecta sem auth (CI)
spring.data.redis.password=${REDIS_PASSWORD:}

# Outros Mocks
twofactor.provider=logger
api.smtp.token=dummy

# E-mail dummy
spring.mail.host=localhost
spring.mail.port=465
spring.mail.username=dummy
spring.mail.password=dummy

# Módulo CNPJ — timeout curto para testes; URL real (nenhum teste bate na rede)
cnpj.brasil-api.url=https://brasilapi.com.br
cnpj.timeout-seconds=2
cnpj.cache-ttl-hours=1
cnpj.cache-max-size=10
