spring.config.import=optional:file:.env[.properties]
spring.application.name=echoes-server
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_USER_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.ssl.enabled=${USE_SSL:false}
server.ssl.key-store=${SSL_KEYSTORE_PATH:}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=${SSL_KEYSTORE_TYPE:PKCS12}
server.ssl.key-alias=${SSL_ALIAS:}
# Atrás de proxy TLS (nginx/ALB): respeita X-Forwarded-Proto para gerar URLs e HSTS corretos (S3)
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

spring.mail.host=${EMAIL_HOST}
spring.mail.port=${EMAIL_PORT}
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# JPA / Hibernate
# Gerenciamento do schema pelo Hibernate (sem Flyway)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# spring.jpa.show-sql=true

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# MQTT — autocadastro de dispositivos
mqtt.enabled=${MQTT_ENABLED:true}
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client-id=${MQTT_CLIENT_ID:echoes-server-registration}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.registration-topic=${MQTT_REGISTRATION_TOPIC:register}
mqtt.ack-topic=${MQTT_ACK_TOPIC:register/ack/{hardware_id}}
mqtt.qos=${MQTT_QOS:1}
mqtt.clean-session=${MQTT_CLEAN_SESSION:true}
mqtt.connection-timeout-seconds=${MQTT_CONNECTION_TIMEOUT_SECONDS:10}
mqtt.keep-alive-seconds=${MQTT_KEEP_ALIVE_SECONDS:60}
mqtt.reconnect-delay-seconds=${MQTT_RECONNECT_DELAY_SECONDS:5}

api.security.token.secret=${JWT_SECRET}
api.security.files-extensions-allowed=${EXTENSIONS_ALLOWED}
api.security.admin.email=${ADMIN_EMAIL}
api.security.admin.username=${ADMIN_NAME}
api.security.admin.password=${ADMIN_PASSWORD}

twofactor.provider=${TWO_FACTOR_PROVIDER}

file.upload-dir=${UPLOAD_DIR}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Módulo CNPJ — Brasil API
cnpj.brasil-api.url=${CNPJ_BRASIL_API_URL:https://brasilapi.com.br}
cnpj.timeout-seconds=${CNPJ_TIMEOUT_SECONDS:10}
cnpj.cache-ttl-hours=${CNPJ_CACHE_TTL_HOURS:24}
cnpj.cache-max-size=${CNPJ_CACHE_MAX_SIZE:500}

# Notificação de instituições
institution.notifier=${INSTITUTION_NOTIFIER:email}
institution.alert-email=${INSTITUTION_ALERT_EMAIL:}

# Scheduler de reverificação de CNPJ
institution.verification.retry-interval-ms=${INSTITUTION_RETRY_INTERVAL_MS:1800000}
institution.verification.initial-delay-ms=${INSTITUTION_INITIAL_DELAY_MS:60000}

# Documentação da API (Swagger) só em desenvolvimento: desligada por padrão (S7).
# Para ligar localmente, defina SWAGGER_ENABLED=true no .env.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Limitação de taxa por IP em login/MFA/recuperação/entrada em turma (S9)
api.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
# X-Forwarded-For só é confiável atrás de um proxy que você controla (S13)
api.security.trust-forwarded-for=${TRUST_FORWARDED_FOR:false}
# Origens do front liberadas por CORS (S22); separe por vírgula
api.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*}

# URL pública do front, usada nos links de convite por e-mail (B9)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Chave HMAC que assina os registros de auditoria; não fica no banco (S15). Mínimo 32 bytes.
api.audit.hmac-key=${AUDIT_HMAC_KEY:}

# Cookie da sessão (S10): HttpOnly sempre; Secure e SameSite configuráveis
api.session.cookie-secure=${SESSION_COOKIE_SECURE:true}
api.session.same-site=${SESSION_COOKIE_SAMESITE:Strict}
api.session.max-age-seconds=7200

# Token de dispositivo (S12): false aceita firmware antigo sem jti durante a migração
api.device.jwt.require-jti=${DEVICE_JWT_REQUIRE_JTI:true}
