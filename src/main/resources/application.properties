spring.config.import=optional:file:.env[.properties]
spring.application.name=echoes-server
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_USER_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.ssl.enabled=${USE_SSL:false}
server.ssl.key-store=${SSL_KEYSTORE_PATH:}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=${SSL_KEYSTORE_TYPE:PKCS12}
server.ssl.key-alias=${SSL_ALIAS:}

spring.mail.host=${EMAIL_HOST}
spring.mail.port=${EMAIL_PORT}
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.socketfactory.port=465
spring.mail.properties.mail.smtp.socketfactory.class=javax.net.ssl.SSLSocketFactory

# FLYWAY — versionamento do schema e dos documentos legais
# SQL em classpath:db/migration; Java Migrations em com/n0hana/echoes_server/db/migration
# (observe o separador '/' — o formato de "pacote" com pontos não é descoberto pelo Flyway 11)
spring.flyway.locations=classpath:db/migration,classpath:com/n0hana/echoes_server/db/migration
# Bancos existentes (sem flyway_schema_history) são baselineados na versão 0,
# para que todas as migrations pendentes sejam executadas.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

api.security.token.secret=${JWT_SECRET}
api.security.files-extensions-allowed=${EXTENSIONS_ALLOWED}

twofactor.provider=${TWO_FACTOR_PROVIDER}

file.upload-dir=${UPLOAD_DIR}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Módulo CNPJ — Brasil API
cnpj.brasil-api.url=${CNPJ_BRASIL_API_URL:https://brasilapi.com.br}
cnpj.timeout-seconds=${CNPJ_TIMEOUT_SECONDS:10}
cnpj.cache-ttl-hours=${CNPJ_CACHE_TTL_HOURS:24}
cnpj.cache-max-size=${CNPJ_CACHE_MAX_SIZE:500}

# Notificação de instituições
institution.notifier=${INSTITUTION_NOTIFIER:email}
institution.alert-email=${INSTITUTION_ALERT_EMAIL:}

# Scheduler de reverificação de CNPJ
institution.verification.retry-interval-ms=${INSTITUTION_RETRY_INTERVAL_MS:1800000}
institution.verification.initial-delay-ms=${INSTITUTION_INITIAL_DELAY_MS:60000}
